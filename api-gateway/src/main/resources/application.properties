spring.application.name=api-gateway
server.port=8085

spring.cloud.gateway.server.webflux.routes[0].id=developer-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://DEVELOPER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/developers/**

management.endpoint.gateway.access=read-only
management.endpoints.web.exposure.include=gateway

eureka.client.service-url.defaultZone=http://service-registry:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true